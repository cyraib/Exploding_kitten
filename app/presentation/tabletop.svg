<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <title>Authored warm wooden game table</title>
  <desc>Original vector reconstruction: angled honey-colored planks, a snack bowl, cup, game controller, cable and napkin. No official game image is embedded.</desc>
  <defs>
    <linearGradient id="wood" x1="140" y1="90" x2="1630" y2="990" gradientUnits="userSpaceOnUse"><stop stop-color="#c35c24"/><stop offset=".35" stop-color="#ed922e"/><stop offset=".63" stop-color="#f3ae43"/><stop offset="1" stop-color="#c56b2c"/></linearGradient>
    <linearGradient id="plank" x1="400" y1="0" x2="430" y2="260" gradientUnits="userSpaceOnUse"><stop stop-color="#fff0a7" stop-opacity=".15"/><stop offset=".55" stop-color="#d55920" stop-opacity=".02"/><stop offset="1" stop-color="#79321a" stop-opacity=".2"/></linearGradient>
    <radialGradient id="light" cx="0" cy="0" r="1" gradientTransform="translate(915 530) rotate(28) scale(1170 730)" gradientUnits="userSpaceOnUse"><stop stop-color="#ffe094" stop-opacity=".27"/><stop offset=".65" stop-color="#edaa46" stop-opacity=".01"/><stop offset="1" stop-color="#371b16" stop-opacity=".54"/></radialGradient>
    <linearGradient id="purple" x1="20" y1="0" x2="240" y2="180" gradientUnits="userSpaceOnUse"><stop stop-color="#8077aa"/><stop offset=".6" stop-color="#57517c"/><stop offset="1" stop-color="#393850"/></linearGradient>
    <linearGradient id="coffee" x1="0" y1="-100" x2="0" y2="60" gradientUnits="userSpaceOnUse"><stop stop-color="#ae734a"/><stop offset="1" stop-color="#583529"/></linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="90" y2="140" gradientUnits="userSpaceOnUse"><stop stop-color="#ffe493"/><stop offset=".48" stop-color="#efb94d"/><stop offset="1" stop-color="#d68525"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="240" y2="280" gradientUnits="userSpaceOnUse"><stop stop-color="#fff3ce"/><stop offset="1" stop-color="#d2ad7f"/></linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="220%"><feDropShadow dx="12" dy="18" stdDeviation="12" flood-color="#431d14" flood-opacity=".3"/></filter>
    <filter id="smallShadow" x="-50%" y="-50%" width="200%" height="220%"><feDropShadow dx="4" dy="8" stdDeviation="4" flood-color="#542313" flood-opacity=".3"/></filter>
    <g id="cracker"><path d="M-48 25 15-58 63 40Q12 64-48 25Z" fill="url(#chip)" stroke="#db993c" stroke-width="3" stroke-linejoin="round"/><path d="m-22 15 6-8m24-30 7 8m16 13 8-5m-13 27 4 9m-29-3 2 6" stroke="#b9792f" stroke-width="4" stroke-linecap="round" opacity=".8"/></g>
  </defs>
  <path fill="url(#wood)" d="M0 0h1920v1080H0z"/>
  <!-- Broad diagonal boards keep the center quiet for cards and character cues. -->
  <g transform="rotate(-13 960 540)">
    <path d="M-320-380h2550v230H-320zM-320-144h2550V92H-320zM-320 100h2550v246H-320zM-320 353h2550v235H-320zM-320 596h2550v240H-320zM-320 844h2550v235H-320zM-320 1086h2550v260H-320z" fill="url(#plank)"/>
    <g stroke="#823718" stroke-width="7" opacity=".4"><path d="M-320-150h2550M-320 94h2550M-320 348h2550M-320 590h2550M-320 838h2550M-320 1081h2550"/></g>
    <g stroke="#ffdb80" stroke-width="3" opacity=".38"><path d="M-320-142h2550M-320 103h2550M-320 357h2550M-320 599h2550M-320 847h2550M-320 1090h2550"/></g>
    <g stroke="#9d4b21" stroke-width="3" opacity=".13"><path d="M-50-42q270 20 485 7t410 8 520-12 600 5M-100 162q190-9 400 6t505-4 615 10 750-13M-200 288q300-28 490-4t440 0 505-8 850 1M-150 426q175-15 395 0t570-7 470 4 820-9M-60 535q250 16 510-3t470 9 475-5 700 4M-120 664q300-11 460 9t480-4 430 4 720-12M-200 782q250 16 470-3t520 7 650-8 650 14M-110 932q225-10 490 0t580-10 500 5 660-11"/></g>
    <g fill="none" stroke="#aa5529" stroke-width="5" opacity=".23"><ellipse cx="380" cy="58" rx="48" ry="13"/><ellipse cx="1670" cy="432" rx="69" ry="16"/><ellipse cx="210" cy="1030" rx="51" ry="12"/></g>
  </g>
