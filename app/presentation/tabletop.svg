    <path d="M-220-50q50 272 238 262 192-3 238-212Z" fill="url(#purple)"/>
    <ellipse cx="12" cy="-13" rx="235" ry="112" fill="#696389" stroke="#aca0c0" stroke-width="14"/>
    <ellipse cx="12" cy="-15" rx="211" ry="88" fill="#393445"/>
    <use href="#cracker" transform="translate(-91 -40) rotate(-29) scale(1.2)"/><use href="#cracker" transform="translate(28 -55) rotate(71) scale(1.4)"/><use href="#cracker" transform="translate(113 9) rotate(18) scale(1.12)"/><use href="#cracker" transform="translate(-23 28) rotate(139) scale(1.28)"/>
    <path d="M-210 18q188 113 436 17" stroke="#9689b3" stroke-width="14" opacity=".55"/>
  </g>
  <g fill="#eabc67" stroke="#d0893c" stroke-width="2" filter="url(#smallShadow)"><path d="m301 278 27-4-8 15-23 4Z"/><path d="m351 325 13-15 18 7-13 17Z"/><path d="m435 97 19 9-21 14-9-12Z"/><path d="m1634 756 22 10-13 18-14-13Z"/><path d="m1763 851 12-13 18 11-19 11Z"/></g>
  <!-- Simple controller; intentionally not an official prop model. -->
  <g transform="translate(1530 18) rotate(16)" filter="url(#shadow)">
    <path d="M-64 26q-2-29 31-27h303q30-2 39 27l22 107q4 29-22 32l-83-11-32-31H59l-27 28-87 12q-30 2-27-29Z" fill="#625176" stroke="#493a59" stroke-width="7"/>
    <path d="M3 66h52m-26-26v52" stroke="#2e2838" stroke-width="20" stroke-linecap="square"/>
    <g fill="#957fad" stroke="#3f344d" stroke-width="3"><circle cx="233" cy="51" r="14"/><circle cx="260" cy="76" r="14"/><circle cx="204" cy="76" r="14"/><circle cx="233" cy="102" r="14"/></g>
    <rect x="93" y="68" width="30" height="10" rx="5" fill="#b790ad"/><rect x="135" y="68" width="30" height="10" rx="5" fill="#b790ad"/>
    <path d="M-22 124h44m184 0h68" stroke="#9b82a7" stroke-width="5" opacity=".45"/>
  </g>
  <!-- Purple ceramic mug at the upper right edge. -->
