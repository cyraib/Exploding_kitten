    <path d="M-104-56q-46 0-54 51-7 70 61 74" fill="none" stroke="#51466b" stroke-width="34"/><path d="M-105-54q-42 1-49 47" fill="none" stroke="#9a87aa" stroke-width="8"/>
    <path d="M-89-62q6 121 31 172 41 55 143 39 70-15 91-74l16-137Z" fill="url(#purple)"/>
    <ellipse cx="48" cy="-64" rx="137" ry="69" fill="#89729e" stroke="#aa8eac" stroke-width="11"/><ellipse cx="48" cy="-67" rx="119" ry="53" fill="url(#coffee)"/>
    <path d="M-24-75q34-28 83-6t66 1" stroke="#cfa07b" stroke-width="12" opacity=".25" stroke-linecap="round"/><path d="M-45-12q5 82 40 115" stroke="#c2a2b7" stroke-width="14" opacity=".23" stroke-linecap="round"/>
  </g>
  <!-- Marginal cable, coaster ring and folded paper leave gameplay space open. -->
  <path d="M-30 624q111-40 204-66t42-89q-79-65-157-10t5 93q66 12 157-59l61-38" stroke="#7a4635" stroke-width="10" opacity=".45"/>
  <path d="M-30 617q111-40 204-66t42-89q-79-65-157-10t5 93q66 12 157-59l61-38" stroke="#716a72" stroke-width="6"/>
  <g transform="translate(304 444) rotate(-32)" filter="url(#smallShadow)"><rect x="-27" y="-10" width="47" height="20" rx="4" fill="#b2a5a1" stroke="#695653" stroke-width="2"/><rect x="15" y="-6" width="21" height="12" rx="2" fill="#e2cbc0"/><path d="M-11-6v12m8-12v12" stroke="#72665e" stroke-width="2"/></g>
  <ellipse cx="1658" cy="486" rx="90" ry="60" transform="rotate(-17 1658 486)" stroke="#8b4d28" stroke-width="13" opacity=".16"/>
  <g transform="translate(1815 840) rotate(-17)" filter="url(#shadow)"><path d="M-170-144 166-153 192 192-153 215Z" fill="url(#paper)"/><path d="m-153-125 127 24-97 147 94 151" stroke="#fff7dd" stroke-width="34" opacity=".3"/><ellipse cx="83" cy="-31" rx="128" ry="155" fill="#d1ba98" stroke="#f4ddba" stroke-width="16"/><ellipse cx="86" cy="-32" rx="102" ry="128" fill="#947550"/><use href="#cracker" transform="translate(53 -53) rotate(20) scale(1.14)"/><use href="#cracker" transform="translate(128 -6) rotate(134) scale(1.06)"/><use href="#cracker" transform="translate(39 30) rotate(-25) scale(.98)"/></g>
  <path fill="url(#light)" d="M0 0h1920v1080H0z"/>
</svg>
