<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kitten Studio · Developer Dashboard</title><link rel="icon" href="/Assets/cards/exploding-kitten/exploding-kitten.png"><link rel="stylesheet" href="/app/editor/editor.css"><script type="module" src="/app/editor/editor.js"></script></head>
<body><header><a class="logo" href="/app/editor/index.html">✳ <strong>KITTEN STUDIO</strong><small>DEVELOPER DASHBOARD</small></a><input id="search" type="search" placeholder="Search cards, effects, animations, code…" aria-label="Global search"><a href="/" target="_blank">Open game ↗</a><button id="export">Export JSON</button><label class="upload">Import<input id="import" type="file" accept="application/json" hidden></label><button id="save" class="primary">Save project</button></header>
<div id="status" role="status">Loading project…</div><div class="workspace"><nav id="nav" aria-label="Dashboard sections"></nav><main><div class="section-head"><div><small id="kicker">PROJECT WORKSPACE</small><h1 id="title">Overview</h1></div><div id="sectionActions"></div></div><div class="browse"><div id="list"></div><section id="detail" aria-label="Selected item"></section></div></main><aside class="preview"><div class="preview-header"><strong>LIVE GAME / SANDBOX</strong><button id="inspect">Inspect element</button><select id="viewport" aria-label="Preview viewport"><option value="desktop">Desktop</option><option value="tablet">Tablet</option><option value="mobile">Mobile</option></select><button id="reload">Reload</button></div><div class="frame-wrap"><iframe id="gameFrame" title="Isolated live game preview" src="/?editor=1"></iframe></div><div class="preview-footer">Preview saves are separate from your normal game. Draft changes stay here until Save project.</div><pre id="inspection" hidden></pre></aside></div>
<dialog id="sourceDialog"><div class="source-head"><strong id="sourceTitle">Source</strong><button id="closeSource">Close</button></div><pre id="sourceText"></pre></dialog><input id="assetUpload" type="file" accept="image/png,image/jpeg,image/webp,image/gif,audio/*,.woff,.woff2,.ttf" hidden></body></html>
